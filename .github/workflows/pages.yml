name: Publish mind map
on:
  push:
    branches: [main]
    paths: ["1-Onboarding/mind-map/**", "2-Structuring and testing data/mind-map/**"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p "_site/1-Onboarding" "_site/2-Structuring and testing data"
          cp -r 1-Onboarding/mind-map _site/1-Onboarding/
          cp -r "2-Structuring and testing data/mind-map" "_site/2-Structuring and testing data/"
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
